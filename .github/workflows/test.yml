name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compiled CSS must be up to date
        run: npm run build:css && git diff --exit-code css/tailwind.css
      - run: npm test
      - name: Database permission tests (throwaway PostgreSQL)
        run: |
          ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || sudo apt-get install -y postgresql
          npm run test:db
      - run: npm run test:browser
